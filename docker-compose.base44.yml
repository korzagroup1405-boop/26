services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mekan76
      POSTGRES_PASSWORD: mekan76_local_pw
      POSTGRES_DB: mekan76
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mekan76 -d mekan76']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: on-failure

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgres://mekan76:mekan76_local_pw@db:5432/mekan76
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    env_file:
      - path: /run/base44/app.env
        required: false
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command:
      [
        'sh',
        '-ec',
        'npm install --no-audit --no-fund && node scripts/db-setup.mjs && exec npm run dev',
      ]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 6s
      retries: 6
      start_period: 180s
    restart: on-failure

volumes:
  db_data:
  node_modules:
